version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: gaming_hub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaming_hub_db}
      POSTGRES_USER: ${POSTGRES_USER:-gaming_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaming_pass_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gaming_user} -d ${POSTGRES_DB:-gaming_hub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Channel Layer & Caching Container
  redis:
    image: redis:7-alpine
    container_name: gaming_hub_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Channels Daphne ASGI Web Container
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming_hub_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 gaming_hub.asgi:application"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-gaming-hub-super-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0,web}
      - DATABASE_URL=postgres://${POSTGRES_USER:-gaming_user}:${POSTGRES_PASSWORD:-gaming_pass_secret}@db:5432/${POSTGRES_DB:-gaming_hub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
